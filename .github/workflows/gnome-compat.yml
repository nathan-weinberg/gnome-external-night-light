name: GNOME compatibility

# Runs the extension in a real headless gnome-shell on each GNOME release
# Fedora and Ubuntu ship, and checks that it loads, tints a monitor with exactly
# Mutter's Night Light color, and disables cleanly. See tests/.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: GNOME ${{ matrix.gnome }} (${{ matrix.distro }} ${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: Fedora, release: '42', gnome: '48', image: 'registry.fedoraproject.org/fedora:42', experimental: false}
          - {distro: Fedora, release: '43', gnome: '49', image: 'registry.fedoraproject.org/fedora:43', experimental: false}
          - {distro: Fedora, release: '44', gnome: '50', image: 'registry.fedoraproject.org/fedora:44', experimental: false}
          - {distro: Fedora, release: '45', gnome: '51', image: 'registry.fedoraproject.org/fedora:45', experimental: false}
          - {distro: Fedora, release: rawhide, gnome: next, image: 'registry.fedoraproject.org/fedora:rawhide', experimental: true}
          # Ubuntu patches gnome-shell and packages colord's typelib
          # separately, so it's worth covering on its own.
          - {distro: Ubuntu, release: '26.04', gnome: '50', image: 'docker.io/library/ubuntu:26.04', experimental: false}
          - {distro: Ubuntu, release: '26.10', gnome: '51', image: 'docker.io/library/ubuntu:26.10', experimental: false}
    container:
      image: ${{ matrix.image }}
      # gnome-shell 49+ encodes screenshots through glycin, whose loaders run
      # in a bubblewrap sandbox; bwrap needs namespaces a default container
      # doesn't allow.
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Run test
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/test-artifacts
        run: tests/ci.sh

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-${{ matrix.gnome }}-${{ matrix.distro }}-${{ matrix.release }}
          path: test-artifacts/
          if-no-files-found: ignore
