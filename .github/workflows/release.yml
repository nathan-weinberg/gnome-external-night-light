name: Release

# Push a tag named v<version-name> (matching metadata.json) to run the GNOME
# compatibility tests, then pack the extension, upload it to
# extensions.gnome.org for review, and attach the zip to a GitHub release.
#
# Requires repository (or "ego" environment) secrets EGO_USERNAME and
# EGO_PASSWORD for an extensions.gnome.org account that owns the extension.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/gnome-compat.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ego
    permissions:
      contents: write
    container:
      # `gnome-extensions upload` is new in GNOME 49.
      image: registry.fedoraproject.org/fedora:43
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: dnf -y -q install gnome-shell jq

      - name: Check tag matches metadata.json version-name
        run: |
          version=$(jq -r '."version-name"' metadata.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version-name $version in metadata.json"
            exit 1
          fi

      - name: Pack
        # --out-dir must already exist; gnome-extensions segfaults otherwise.
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir=dist .

      - name: Upload to extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          printf '%s' "$EGO_PASSWORD" |
            gnome-extensions upload --accept-tos \
              --user "$EGO_USERNAME" --password-file - dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dnf -y -q install gh
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
